name: Bug report
description: Something in Hop doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Please don't file it here; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a link with …
        2. Open …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Deployed on Cloudflare
        - Deployed with Docker (oauth2-proxy)
        - Deployed with Docker (Authelia)
        - Deployed with Docker (Cloudflare Access tunnel)
        - Exported stack (Portainer or another host)
        - Local development (npm run dev)
        - npm run setup / deploy / doctor
        - npm run setup:docker / --export / doctor --docker
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hop version or commit
      placeholder: e.g. 0.1.0, a commit hash, or an image tag
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove account IDs, domains, tokens and anything from .env before pasting.
