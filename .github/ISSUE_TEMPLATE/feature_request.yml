name: Feature idea
description: Suggest something Hop could do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Hop aims to stay small. Please check the non-goals in docs/SPEC.md first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you imagine it working. Alternatives you've considered are useful too.
    validations:
      required: true
